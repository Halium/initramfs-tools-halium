name: halium-initramfs
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [armhf, arm64, amd64]
        # Same scripts either way, the LVM build just also ships lvm2.
        variant:
          - suffix: ""
            lvm: 0
          - suffix: "-lvm"
            lvm: 1

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Initialize environment
        run: |
          sudo apt-get update
          sudo apt-get install qemu-user-static debootstrap -y

      - name: Build initramfs
        run: sudo ARCH=${{ matrix.arch }} LVM=${{ matrix.variant.lvm }} ./build-initrd.sh

      - name : Upload artifacts
        uses: actions/upload-artifact@master
        with:
          name: halium-initramfs-${{ matrix.arch }}${{ matrix.variant.suffix }}
          path: out/

  upload:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dynparts'
    permissions:
      contents: write

    steps:
      - name: Checkout
        if: github.ref == 'refs/heads/dynparts'
        uses: actions/checkout@v4

      # Keep a "dynparts" tag pinned to the branch head so the release below
      # always points at the commit we just built.
      - name: Move the dynparts tag
        if: github.ref == 'refs/heads/dynparts'
        run: |
          git tag -f dynparts
          git push -f origin refs/tags/dynparts

      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      # Here we're abusing the "continuous" tag/release to store the latest
      # built image. This is not very good practice, but GitHub won't allow
      # unauthenticated user to download artifacts. Hence, this abuse.

      - name: Release to the continuous tag.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: halium-initramfs-*/*
          fail_on_unmatched_files: true
